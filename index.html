<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로또 6/45 번호 생성기</title>
<style>
:root{--navy:#13233f;--blue:#315fbd;--gold:#f4bd4f;--bg:#f4f7fb;--muted:#6d7890}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:var(--navy);background:radial-gradient(circle at 15% 10%,#e1edff 0,transparent 30%),var(--bg);display:flex;align-items:center;justify-content:center;padding:28px}
main{width:min(760px,100%)}
header{text-align:center;margin-bottom:25px}
.tag{display:inline-block;padding:6px 12px;border-radius:30px;background:#e5edff;color:var(--blue);font-size:12px;font-weight:800;letter-spacing:.12em}
h1{font-size:clamp(30px,6vw,46px);letter-spacing:-.06em;margin:13px 0 7px}
.subtitle{margin:0;color:var(--muted)}
.panel{background:#fff;border:1px solid #e5eaf2;border-radius:24px;padding:clamp(22px,5vw,38px);box-shadow:0 18px 55px #1b315015}
.result-label{text-align:center;color:var(--muted);font-size:14px;font-weight:700}
.balls{display:flex;justify-content:center;gap:clamp(7px,2vw,14px);flex-wrap:wrap;margin:25px 0 30px;min-height:66px;align-items:center}
.ball{width:clamp(43px,9vw,62px);height:clamp(43px,9vw,62px);border-radius:50%;display:grid;place-items:center;color:#fff;font-size:clamp(18px,4vw,24px);font-weight:900;box-shadow:inset 0 -4px 0 #00000013,0 5px 12px #17253b18;animation:pop .28s ease-out both}
@keyframes pop{from{opacity:0;transform:scale(.65) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}
.placeholder{color:#aab3c1;font-size:14px}
button{width:100%;border:0;border-radius:14px;padding:17px 20px;background:linear-gradient(135deg,#315fbd,#244b9d);color:#fff;font-size:17px;font-weight:850;cursor:pointer;box-shadow:0 8px 18px #315fbd35;transition:transform .15s,filter .15s}
button:hover{filter:brightness(1.07);transform:translateY(-2px)}
button:active{transform:translateY(0)}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.stat{background:#f6f8fc;border:1px solid #edf0f5;border-radius:14px;padding:16px;text-align:center}
.stat small{display:block;color:var(--muted);font-weight:700;margin-bottom:5px}
.stat strong{font-size:clamp(18px,4vw,24px);letter-spacing:-.04em}
.odds{margin-top:18px;padding:20px;border-radius:16px;background:#fff8e9;border:1px solid #f7e6bd}
.odds h2{font-size:16px;margin:0 0 9px}
.odds .chance{font-size:clamp(24px,5vw,34px);font-weight:950;color:#a66b00;letter-spacing:-.05em}
.odds p{font-size:13px;color:#76664a;margin:6px 0 0;line-height:1.6}
.disclaimer{text-align:center;color:#8a94a5;font-size:12px;margin:20px 0 0}
footer{text-align:center;color:#8993a4;font-size:12px;margin-top:18px}
@media(max-width:480px){body{padding:17px}.stats{gap:8px}.stat{padding:13px 8px}}
</style>
</head>
<body>
<main>
<header>
  <span class="tag">LOTTO 6 / 45</span>
  <h1>오늘의 행운 번호</h1>
  <p class="subtitle">버튼을 누르면 새로운 로또 번호 6개가 생성됩니다.</p>
</header>
<section class="panel" aria-label="로또 번호 생성기">
  <div class="result-label" id="resultLabel" aria-live="polite">행운의 번호를 생성해 보세요!</div>
  <div class="balls" id="balls" aria-live="polite"><span class="placeholder">번호가 여기에 표시됩니다</span></div>
  <button id="generate" type="button">✨ 로또 번호 생성하기</button>
  <div class="stats">
    <div class="stat"><small>생성 횟수</small><strong id="count">0회</strong></div>
    <div class="stat"><small>번호 범위</small><strong>1 ~ 45</strong></div>
  </div>
  <div class="odds">
    <h2>🎯 로또 1등 당첨 확률</h2>
    <div class="chance">약 0.0000123%</div>
    <p>1등 확률은 <strong>8,145,060분의 1</strong>입니다.<br>45개 숫자 중 순서와 관계없이 6개를 모두 맞혀야 합니다.</p>
  </div>
  <p class="disclaimer">이 번호는 무작위로 생성되며 실제 당첨을 예측하거나 보장하지 않습니다.</p>
</section>
<footer>행운을 빕니다! 🍀 · 재미로 즐기는 로또 번호 생성기</footer>
</main>
<script>
const balls = document.getElementById('balls');
const countLabel = document.getElementById('count');
const resultLabel = document.getElementById('resultLabel');
let count = 0;

function makeNumbers() {
  // 1~45 중 중복 없이 6개 추출 (Fisher–Yates 방식)
  const pool = Array.from({length: 45}, (_, i) => i + 1);
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  return pool.slice(0, 6).sort((a, b) => a - b);
}

function colorFor(n) {
  if (n <= 10) return '#f4b52f';
  if (n <= 20) return '#4388d5';
  if (n <= 30) return '#e45b58';
  if (n <= 40) return '#858b96';
  return '#48a879';
}

document.getElementById('generate').addEventListener('click', () => {
  const numbers = makeNumbers();
  count += 1;
  balls.replaceChildren();
  numbers.forEach((number, index) => {
    const ball = document.createElement('span');
    ball.className = 'ball';
    ball.textContent = number;
    ball.style.background = colorFor(number);
    ball.style.animationDelay = `${index * 55}ms`;
    balls.appendChild(ball);
  });
  countLabel.textContent = `${count}회`;
  resultLabel.textContent = `생성된 행운의 번호 · ${count}번째`;
});
</script>
</body>
</html>
